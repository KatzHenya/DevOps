server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # מזריק את ה-Backend URL כ-JavaScript variable לפני הגשת ה-HTML
    location / {
        sub_filter '<script>' '<script>window.BACKEND_URL = "$BACKEND_URL";';
        sub_filter_once on;
        try_files $uri $uri/ /index.html;
    }
}
