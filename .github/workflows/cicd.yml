name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PROJECT_ID: project-d24488cc-167d-4a0a-8b2
  REGION: us-central1
  REPO: kanban-repo
  GKE_CLUSTER: kanban-cluster
  GKE_ZONE: us-central1

jobs:
  # ─────────────────────────────────────────────
  # שלב CI: בדיקות + בנייה + דחיפה ל-Registry
  # ─────────────────────────────────────────────
  ci:
    name: CI - Lint, Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies for linting
        run: pip install flake8

      - name: Lint Backend with Flake8
        run: flake8 backend/app.py --max-line-length=120

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/kanban-backend:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/kanban-backend:latest \
            ./backend
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/kanban-backend:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/kanban-backend:latest

      - name: Build & Push Frontend Image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/kanban-frontend:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/kanban-frontend:latest \
            ./frontend
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/kanban-frontend:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/kanban-frontend:latest

  # ─────────────────────────────────────────────
  # שלב CD: פריסה ל-GKE + Cloud Run
  # ─────────────────────────────────────────────
  cd:
    name: CD - Deploy to GKE & Cloud Run
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install gke-gcloud-auth-plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --region=${{ env.GKE_ZONE }} \
            --project=${{ env.PROJECT_ID }}

      - name: Deploy Backend to GKE
        run: |
          # עדכון ה-image ב-deployment
          kubectl set image deployment/kanban-backend \
            backend=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/kanban-backend:${{ github.sha }} \
            --namespace=default || \
          kubectl apply -f k8s/

          # המתנה לסיום הפריסה
          kubectl rollout status deployment/kanban-backend --namespace=default --timeout=300s

      - name: Get Backend Internal URL
        id: backend-url
        run: |
          echo "url=http://kanban-backend.default.svc.cluster.local:5000" >> $GITHUB_OUTPUT

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy kanban-frontend \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/kanban-frontend:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars=BACKEND_URL=${{ steps.backend-url.outputs.url }} \
            --vpc-connector=kanban-connector \
            --vpc-egress=private-ranges-only \
            --port=80

      - name: Print Frontend URL
        run: |
          URL=$(gcloud run services describe kanban-frontend \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "Frontend URL: $URL"
